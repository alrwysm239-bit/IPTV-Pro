name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-apk
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      CI_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          MAJOR=$(java -version 2>&1 | head -n1 | sed -E 's/.*"([0-9]+)[."].*/\1/')
          echo "Java major version: $MAJOR"
          if [ "$MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build web assets for Android
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
            else
              npm install --legacy-peer-deps --no-audit --no-fund
            fi
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              npm run build
            else
              echo "No build script found, skipping web build"
            fi
            if ls capacitor.config.* >/dev/null 2>&1 && [ -d android ]; then
              npx cap sync android
            fi
          else
            echo "No package.json found, skipping web build"
          fi

      - name: Prepare persistent debug keystore
        env:
          KS_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SOURCE=""
          if [ -n "$KS_SECRET" ]; then
            echo "$KS_SECRET" | base64 -d > debug.keystore
            SOURCE="repository secret"
          elif git ls-remote --exit-code --heads origin debug-signing >/dev/null 2>&1; then
            git fetch origin debug-signing --depth=1
            git show FETCH_HEAD:debug.keystore > debug.keystore
            SOURCE="debug-signing branch"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            if [ ! -f debug.keystore ]; then
              echo "::error::Could not create debug.keystore"
              exit 1
            fi
            SAVE="$RUNNER_TEMP/signing"
            rm -rf "$SAVE"
            mkdir -p "$SAVE"
            cp debug.keystore "$SAVE/debug.keystore"
            cd "$SAVE"
            git init -q -b debug-signing
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -q -m "Persist debug keystore"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug-signing
            cd "$GITHUB_WORKSPACE"
            SOURCE="newly generated and saved to debug-signing branch"
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "::error::debug.keystore cannot be read with password 'android'"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"
          echo "Keystore source: $SOURCE"

      - name: Set CI version code
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/ci-version.gradle" <<'EOF'
          allprojects {
              plugins.withId("com.android.application") {
                  def vc = (System.getenv("CI_VERSION_CODE") ?: "1") as int
                  def comps = extensions.getByName("androidComponents")
                  comps.onVariants(comps.selector().all(), { variant ->
                      variant.outputs.each { out ->
                          out.versionCode.set(vc)
                      }
                  })
              }
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "Expected APK is missing. APK files found:"
            find app/build/outputs/apk -name "*.apk" -print 2>/dev/null || true
            echo "::error::Debug APK not found"
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | head -n1
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:" | head -n1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag -y || true
          gh release create latest-debug app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build #${{ github.run_number }}" \
            --notes "versionCode=${{ github.run_number }}"
