  [['n','اسم المصدر'],['server','عنوان السيرفر'],['user','اسم المستخدم'],['pass','كلمة المرور']].forEach(([f,l])=>{const d=h('div','f');d.append(h('label',null,l));const inp=h('input');inp.type='text';inp.value=x[f]||'';inp.dataset.f=f;if(f!=='n')inp.className='ltr';d.append(inp);r.append(d)});
  if(a.length>1){const b=h('button','btn d','حذف المصدر');b.onclick=()=>{const z=cs();z.splice(i,1);ds(z)};r.append(b)}sw_.append(r)})};ds(cfg.sources.map(x=>({...x})));
 const as_=h('button','btn','+ إضافة مصدر');as_.onclick=()=>{const z=cs();z.push({n:'مصدر '+(z.length+1),server:'',user:'',pass:''});ds(z)};P.sv.append(sw_,as_,h('p','hint','كل مصدر يظهر كزر في أعلى القنوات والأفلام للتبديل بينها.'));
 const lw=h('div');const col=()=>[...lw.querySelectorAll('.lr')].map(r=>({n:r.children[0].value.trim(),u:r.children[1].value.trim()}));
 const dl=a=>{lw.textContent='';a.forEach((l,i)=>{const r=h('div','lr'),x=h('input'),y=h('input','ltr'),d=h('button','btn d','حذف');x.value=l.n;x.placeholder='الاسم';y.value=l.u;y.placeholder='https://t.me/...';d.onclick=()=>{const z=col();z.splice(i,1);dl(z)};r.append(x,y,d);lw.append(r)})};dl(cfg.links.map(l=>({...l})));
 const ad=h('button','btn','+ إضافة رابط');ad.onclick=()=>{const z=col();z.push({n:'',u:''});dl(z)};
 const t3=h('div','two');t3.append(fld('اسم المطور','devName',{l:1}),fld('رابط المطور','devUrl',{l:1}));P.k.append(lw,ad,h('div','sh'),t3,fld('نص الحقوق (فارغ = الافتراضي)','copyright'));
 const ckb=(pre,cats)=>{const b=h('div','ck');cats.forEach(c=>{const l=h('label'),i=h('input');i.type='checkbox';i.dataset.cid=pre+':'+sp()+c.category_id;i.checked=!cfg.hidden.includes(pre+':'+sp()+c.category_id);l.append(i,h('span',null,c.category_name));b.append(l)});return b};
 P.c.append(h('p','hint','أزل العلامة لإخفاء القسم. أقسام القنوات:'),ckb('l',T.live.cats));
 if(T.vod.ok)P.c.append(h('p','hint','أقسام الأفلام:'),ckb('v',T.vod.cats));else P.c.append(h('p','hint','افتح تبويب الأفلام أولاً لتظهر أقسامها هنا.'));
 P.a.append(fld('كلمة مرور لوحة التحكم','pin',{l:1}),h('p','hint','كلمة المرور تحمي اللوحة من الاستخدام العرضي فقط، لأنها محفوظة داخل التطبيق نفسه.'));
 const rs=h('button','btn d','استعادة الافتراضي');rs.onclick=()=>{if(confirm('استعادة كل الإعدادات؟')){cfg={...D};ls(KC,cfg);apply();T.vod.ok=false;load();panel()}};P.a.append(rs);
 const sv=h('button','btn m','حفظ وتطبيق');sv.onclick=()=>{const n={...cfg};
  s.querySelectorAll('[data-key]').forEach(e=>n[e.dataset.key]=e.type==='checkbox'?e.checked:e.value);
  n.links=col().filter(l=>l.u);n.sources=cs().filter(x=>x.server&&x.user&&x.pass);if(!n.sources.length)n.sources=D.sources;if(n.src>=n.sources.length)n.src=0;const boxes=[...s.querySelectorAll('[data-cid]')];
  n.hidden=cfg.hidden.filter(x=>!boxes.some(b=>b.dataset.cid===x)).concat(boxes.filter(b=>!b.checked).map(b=>b.dataset.cid));
  if(!n.pin.trim())n.pin=D.pin;const rl=JSON.stringify(n.sources)!==JSON.stringify(cfg.sources);
  cfg=n;ls(KC,cfg);apply();if(rl){T.vod.ok=false;load()}else draw();toast('تم الحفظ');closeA()};
 const ac=h('div','acts');ac.append(sv);s.append(head(),tb,...Object.values(P),ac)}
function splash(){const e=$('sp');if(!cfg.showSplash){e.remove();return}$('spn').textContent=cfg.appName;$('spd').textContent='by @'+cfg.devName.replace(/^@/,'');
 const end=()=>{e.classList.add('out');setTimeout(()=>e.remove(),500)};e.onclick=end;setTimeout(end,3500)}
apply();splash();draw();addEventListener('DOMContentLoaded',load);
</script></body></html>
